<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecipeAI — AI Recipe Generator</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-wrap">
                <div class="logo-icon">🍽️</div>
                <div>
                    <div class="logo-text">RecipeAI</div>
                    <div class="logo-sub">Semantic Kernel × Gemini</div>
                </div>
            </div>
        </header>

        <!-- Hero Banner -->
        <div class="hero-banner">
            <div class="hero-content">
                <h1 class="hero-title">What are you <em>craving</em> today?</h1>
                <p class="hero-desc">Type any dish — get a full AI-crafted recipe in seconds.</p>
            </div>
            <div class="hero-emojis" aria-hidden="true">
                <span>🍜</span><span>🍕</span><span>🥘</span><span>🍣</span><span>🥗</span><span>🍰</span>
            </div>
        </div>

        <!-- Input Card -->
        <div class="card input-card">
            <div class="form-row">
                <div class="form-group">
                    <label for="dish-input">Dish Name</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔍</span>
                        <input type="text" id="dish-input" placeholder="e.g. Butter Chicken, Tiramisu, Pad Thai..." autocomplete="off" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="format-select">Recipe Style</label>
                    <div class="select-wrapper">
                        <select id="format-select">
                            <option value="step-by-step">📋 Step-by-Step</option>
                            <option value="brief">⚡ Brief Summary</option>
                            <option value="professional chef style">👨‍🍳 Chef Style</option>
                            <option value="beginner friendly">🌱 Beginner Friendly</option>
                        </select>
                        <span class="select-icon">▾</span>
                    </div>
                </div>
            </div>
            <button id="generate-btn" class="btn-generate">
                <span class="btn-text">✨ Generate Recipe</span>
                <span class="btn-loading hidden"><span class="spinner"></span> Crafting your recipe...</span>
            </button>
        </div>

        <!-- Skeleton -->
        <div id="skeleton" class="card skeleton-card hidden">
            <div class="skeleton-hero"></div>
            <div class="skeleton-body">
                <div class="skeleton-line w55"></div>
                <div class="skeleton-line w80"></div>
                <div class="skeleton-line w65"></div>
                <div class="skeleton-line w90"></div>
                <div class="skeleton-line w70"></div>
                <div class="skeleton-line w85"></div>
            </div>
        </div>

        <!-- Result Card -->
        <div id="result-section" class="card result-card hidden">
            <div id="recipe-hero" class="recipe-hero">
                <img id="hero-img" class="hero-img" src="" alt="" />
                <div class="hero-img-fallback" id="hero-fallback"></div>
                <div class="recipe-hero-overlay">
                    <div class="recipe-meta">
                        <span id="recipe-badge" class="recipe-badge"></span>
                    </div>
                    <h2 id="result-title" class="result-title"></h2>
                    <div class="result-actions">
                        <button id="copy-btn" class="btn-pill">📋 Copy Recipe</button>
                        <button id="new-recipe-btn" class="btn-pill btn-ghost">🔄 New Recipe</button>
                    </div>
                </div>
            </div>
            <div id="recipe-output" class="recipe-output"></div>
        </div>

        <!-- Error Card -->
        <div id="error-section" class="card error-card hidden">
            <div class="error-icon">😕</div>
            <h3 class="error-title">Something went wrong</h3>
            <p id="error-message" class="error-message"></p>
            <button id="retry-btn" class="btn-retry">Try Again</button>
        </div>

        <footer class="footer">Built with ❤️ using Semantic Kernel &amp; Google Gemini</footer>
    </div>

    <div id="toast" class="toast hidden">✅ Copied to clipboard!</div>

    <script src="/static/js/app.js"></script>
</body>
</html>
